<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Recipe Finder App
  </title>

  <link
    rel="stylesheet"
    href="/src/css/normalize.css"
  />

  <link
    rel="stylesheet"
    href="/src/css/style.css"
  />
</head>

<body>

  <header class="main-header">

    <h1>
      🍴 Recipe Finder
    </h1>

    <nav>
      <a href="/">
        Home
      </a>

      <a href="/favorites/">
        Favorites
      </a>
    </nav>

  </header>

  <main>

    <section class="hero">

      <h2>
        Find Recipes Using
        Ingredients You Have
      </h2>

      <p>
        Search meals quickly,
        reduce food waste,
        and discover new dishes.
      </p>

      <div class="search-box">

        <input
          type="text"
          id="searchInput"
          placeholder="Search ingredient..."
        />

        <button id="searchBtn">
          Search
        </button>

      </div>

    </section>

    <section class="recipes">

      <div
        class="recipe-list"
      ></div>

    </section>

  </main>

  <script
    type="module"
    src="/src/js/main.js"
  ></script>

</body>
</html>

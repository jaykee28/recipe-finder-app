<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Recipe Finder App
  </title>

  <link
    rel="stylesheet"
    href="/src/css/normalize.css"
  />

  <link
    rel="stylesheet"
    href="/src/css/style.css"
  />
</head>

<body>

 <header class="main-header">
  <nav>
    <div class="logo">
      🍴 Recipe Finder
    </div>

    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/src/favorites/">Favorites</a></li>
    </ul>
  </nav>
</header>

  <main>

    <section class="hero">

      <h2>
        Find Recipes Using
        Ingredients You Have
      </h2>

      <p>
        Search meals quickly,
        reduce food waste,
        and discover new dishes.
      </p>

      <div class="search-box">

        <input
          type="text"
          id="searchInput"
          placeholder="Search ingredient..."
        />

        <button id="searchBtn">
          Search
        </button>


        <button id="randomBtn">
  🎲 Random Recipe
</button>
      </div>

    </section>

    <section class="recipes">

<h2 class="results-title">
  Search Results
</h2>

      <div
        class="recipe-list"
      ></div>

    </section>

  </main>

  <script
    type="module"
    src="/src/js/main.js"
  ></script>


<footer class="main-footer">
  <p>
    © 2026 Recipe Finder App |
    Built by Jacqueline Mufetu
  </p>
</footer>

</body>
</html>
